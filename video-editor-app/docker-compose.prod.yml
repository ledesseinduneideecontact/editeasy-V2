version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.prod
      args:
        - NODE_ENV=production
    ports:
      - "3000:3000"
    volumes:
      - uploads:/app/uploads
      - outputs:/app/outputs
      - temp:/app/temp
    environment:
      - NODE_ENV=production
      - AI_SERVICE_URL=http://ai-processor:5000
      - PORT=3000
      - MAX_FILE_SIZE=1073741824
      - MAX_FILES=200
      - FFMPEG_THREADS=0
    depends_on:
      ai-processor:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/api/status/health-check"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - video-editor-network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  ai-processor:
    build:
      context: ./ai-processor
      dockerfile: Dockerfile.prod
    ports:
      - "5000:5000"
    volumes:
      - uploads:/app/uploads:ro
    environment:
      - FLASK_ENV=production
      - PORT=5000
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import requests; requests.get('http://localhost:5000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - video-editor-network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  uploads:
    driver: local
  outputs:
    driver: local
  temp:
    driver: local

networks:
  video-editor-network:
    driver: bridge
